services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: github_workflow_playground_test
      MYSQL_USER: app
      MYSQL_PASSWORD: test_password
      MYSQL_ROOT_PASSWORD: root_password
    healthcheck:
      test: ["CMD-SHELL", "mysql -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" \"$$MYSQL_DATABASE\" -e 'SELECT 1' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 30s

  test:
    build: .
    command: ["sleep", "infinity"]
    volumes:
      - .:/app
    environment:
      RAILS_ENV: test
      DB_HOST: db
      DB_USER: app
      DB_PASSWORD: test_password
    depends_on:
      db:
        condition: service_healthy
